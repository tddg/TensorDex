# TensorDex hot-cache front (plan Phase 2.2) — include from nginx.conf
# http{} context, or drop into /etc/nginx/sites-enabled/.
#
# Data path rule: Python never copies hot bytes. Hits are served
# straight off NVMe by sendfile via try_files; misses proxy to the
# materializer (:8702), which caches the entry and replies
# X-Accel-Redirect so nginx still performs the send.

server {
    listen 8700 default_server;
    server_name _;

    access_log /var/log/nginx/td-cache.access.log;
    sendfile on;
    tcp_nopush on;
    # Big decoded tensors (up to ~2 GB) — no buffering surprises.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # GET /v1/tensor/<tid>  (tid = hex content hash, shard = tid[:2])
    location ~ "^/v1/tensor/(?<shard>[0-9a-f]{2})(?<rest>[0-9a-f]+)$" {
        root /mnt/nvme/cache;
        add_header X-Cache hit;
        add_header ETag "$shard$rest";
        try_files /$shard/$shard$rest @materialize;
    }

    location @materialize {
        proxy_pass http://127.0.0.1:8702;
        proxy_set_header X-Accel-Expected 1;
        proxy_set_header Host $host;
    }

    # Materializer replies X-Accel-Redirect: /_cache/<shard>/<tid>;
    # nginx re-serves the freshly written entry with sendfile.
    location /_cache/ {
        internal;
        alias /mnt/nvme/cache/;
    }

    # Control endpoints pass through to the materializer.
    location ~ ^/(healthz|metrics|v1/warm) {
        proxy_pass http://127.0.0.1:8702;
    }
}
